<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waggle | Giriş</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/login.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-intro">
      <p class="eyebrow">EDGE AI KOVAN İZLEME</p>
      <h1>Waggle</h1>
      <p>Kovanları dinleyen yapay zekâ ile kolonilerinizi güvenle takip edin.</p>
    </section>
    <section class="login-card">
      <div class="bee-mark" aria-hidden="true">🐝</div>
      <p class="eyebrow">YÖNETİM PANELİ</p>
      <h2>Tekrar hoş geldiniz</h2>
      <p class="login-hint">Devam etmek için hesabınıza giriş yapın.</p>
      <form id="login-form">
        <label for="username">Kullanıcı adı</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Parola</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p id="login-error" class="login-error" role="alert"></p>
        <button class="primary-button login-button" type="submit">Giriş yap</button>
      </form>
    </section>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
